<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M. Estiaque Ahmed Khan | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Nosifer&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS RESET & BASE ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B0A08;
            --accent-gold: #C5A880;
            --accent-gold-glow: rgba(197, 168, 128, 0.5);
            --text-primary: #FFFFFF;
            --text-secondary: #A8A8A8;
            --border-outline: #C5A880;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== HERO SECTION CONTAINER ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* ===== LEFT SIDE - TEXT CONTENT ===== */
        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 4rem 4rem 6rem;
            z-index: 2;
        }

        /* ===== NAME WITH NOSIFER FONT ===== */
        .hero-name {
            font-family: 'Nosifer', cursive;
            /* Dripping/melting effect using text-shadow and clip-path */
            color: var(--accent-gold);
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.2;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            /* Dripping effect using layered shadows */
            text-shadow:
                0 0 5px var(--accent-gold-glow),
                0 0 15px var(--accent-gold-glow),
                0 0 30px rgba(197, 168, 128, 0.3);
            /* Subtle animation for melting effect */
            animation: drip 3s ease-in-out infinite;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #E8D5B5 50%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes drip {
            0%, 100% {
                text-shadow:
                    0 0 5px var(--accent-gold-glow),
                    0 0 15px var(--accent-gold-glow),
                    0 0 30px rgba(197, 168, 128, 0.3);
            }
            50% {
                text-shadow:
                    0 0 10px var(--accent-gold-glow),
                    0 0 25px var(--accent-gold-glow),
                    0 0 50px rgba(197, 168, 128, 0.4);
            }
        }

        /* ===== TAGLINE ===== */
        .hero-tagline {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: clamp(1rem, 1.5vw, 1.35rem);
            font-weight: 400;
            color: var(--accent-gold);
            margin-bottom: 3rem;
            line-height: 1.6;
            max-width: 600px;
            letter-spacing: 0.02em;
        }

        /* ===== CTA BUTTONS ===== */
        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        /* Button Base */
        .btn {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 1rem 2.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        /* ===== BUTTON 1: VIEW MY WORK (Solid + Glow) ===== */
        .btn-primary {
            background: var(--accent-gold);
            color: var(--bg-primary);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 20px rgba(197, 168, 128, 0.2);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--accent-gold);
            box-shadow:
                0 0 30px rgba(197, 168, 128, 0.5),
                0 0 60px rgba(197, 168, 128, 0.3),
                inset 0 0 20px rgba(197, 168, 128, 0.1);
            transform: translateY(-2px);
        }

        /* ===== BUTTON 2: LET'S TALK (Outline + Text Reveal) ===== */
        .btn-outline {
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            position: relative;
        }

        .btn-outline::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-gold);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .btn-outline:hover::before {
            left: 0;
        }

        .btn-outline:hover {
            color: var(--bg-primary);
            box-shadow: 0 0 30px rgba(197, 168, 128, 0.4);
            transform: translateY(-2px);
        }

        /* ===== RIGHT SIDE - PROFILE IMAGE CENTERPIECE ===== */
        .hero-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* ===== LIQUID MORPHING PROFILE CONTAINER ===== */
        .profile-container {
            position: relative;
            width: min(450px, 80vw);
            height: min(450px, 80vw);
            /* Floating animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* ===== LIQUID BORDER ANIMATION ===== */
        .profile-liquid-border {
            position: absolute;
            inset: -5px;
            background: linear-gradient(135deg, var(--accent-gold), #E8D5B5, var(--accent-gold));
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 8s ease-in-out infinite;
            z-index: 1;
            filter: blur(1px);
            opacity: 0.8;
        }

        @keyframes morph {
            0% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }
            25% {
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
            }
            50% {
                border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%;
            }
            75% {
                border-radius: 60% 40% 60% 30% / 70% 30% 50% 60%;
            }
            100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }
        }

        /* ===== PROFILE IMAGE ===== */
        .profile-image {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            overflow: hidden;
            animation: morph 8s ease-in-out infinite;
            z-index: 2;
            background-color: #1a1a1a;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.05);
            transition: filter 0.5s ease;
        }

        .profile-image:hover img {
            filter: grayscale(0%) contrast(1.1);
        }

        /* ===== GOLD GLOW EFFECT ===== */
        .profile-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(
                circle at center,
                rgba(197, 168, 128, 0.15) 0%,
                transparent 70%
            );
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== FIXED LEFT EDGE NAVIGATION ===== */
        .social-nav {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            z-index: 100;
        }

        .social-nav-line {
            width: 2px;
            height: 80px;
            background: linear-gradient(
                to bottom,
                transparent,
                var(--accent-gold),
                transparent
            );
            margin: 1rem 0;
        }

        .social-nav a {
            color: var(--accent-gold);
            font-size: 1.5rem;
            transition: all 0.3s ease;
            display: block;
            padding: 0.5rem;
            position: relative;
        }

        .social-nav a:hover {
            color: var(--text-primary);
            transform: scale(1.2);
            text-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .social-nav a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s ease, left 0.3s ease;
        }

        .social-nav a:hover::after {
            width: 100%;
            left: 0;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1024px) {
            .hero-left {
                padding: 3rem;
            }
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
            }

            .hero-left {
                padding: 3rem 2rem 2rem;
                text-align: center;
                align-items: center;
                order: 2;
            }

            .hero-right {
                order: 1;
                padding: 2rem;
            }

            .profile-container {
                width: min(300px, 70vw);
                height: min(300px, 70vw);
            }

            .hero-tagline {
                max-width: 100%;
            }

            .hero-buttons {
                justify-content: center;
            }

            .social-nav {
                left: 10px;
                gap: 1.5rem;
            }

            .social-nav a {
                font-size: 1.2rem;
            }

            .social-nav-line {
                height: 50px;
            }
        }

        @media (max-width: 480px) {
            .hero-left {
                padding: 2rem 1.5rem;
            }

            .hero-name {
                font-size: clamp(1.8rem, 6vw, 2.5rem);
            }

            .hero-tagline {
                font-size: 0.95rem;
            }

            .btn {
                padding: 0.85rem 2rem;
                font-size: 0.85rem;
                width: 100%;
                text-align: center;
            }

            .hero-buttons {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .profile-container {
                width: min(250px, 65vw);
                height: min(250px, 65vw);
            }
        }

        /* ===== SCROLLBAR STYLING ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #E8D5B5;
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- ===== LEFT SIDE: TEXT CONTENT ===== -->
        <div class="hero-left">
