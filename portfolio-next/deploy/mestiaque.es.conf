server {
	listen 80;
	server_name mestiaque.es;

	# Laravel's public/ root is needed here so /api/* rewrites resolve to
	# its index.php front controller (routes/api.php -> messages-store etc).
	root /home/estiaque/Videos/AAA/app/public;

	location /api/ {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.4-fpm.sock;
	}

	# Everything else -> the Next.js portfolio (pm2-managed, `next start -p 3411`).
	location / {
		proxy_pass http://127.0.0.1:3411;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}

	location ~ /\.ht {
		deny all;
	}
}
